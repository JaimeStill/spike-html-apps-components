<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>chat thread specimen</title>
    <!-- The chat thread's specimen page, from dist/: an empty thread, a user and assistant
         exchange, a reply streaming inside an open code fence and another inside a half-built
         list, a refusal, an incomplete reply, a failed one, reasoning and tool calls, an unknown
         item among known ones, and long content, each with verbose off, then on. The thread is as
         tall as its content, so each shows at full size but the long content, which the page
         holds to 16rem by demo.css's held class, so it scrolls.
         Every state is labelled, then shown again in a section 20rem wide; the fit section holds
         a short exchange in three parents that size it to its content, an inline-block, a
         content-sized flex item, and a grid's auto track; and the focus section holds one
         instance whose frame the screenshot script reaches with a Tab press. The thread draws its
         own frame, so main is unframed: no specimen frame around it. The page links the installed
         foundation's full entry, page-full.css, and imports register-full.js, so a profile
         applies by attribute on the root; its import map is components.html's, so it runs served
         only: mise run demo, or mise run screenshots. -->
    <link rel="stylesheet" href="/deps/@jaimestill/spike-html-apps-foundation/dist/page-full.css" />
    <link rel="stylesheet" href="demo.css" />
    <script type="importmap">
      {
        "imports": {
          "lit": "/deps/lit/index.js",
          "lit/": "/deps/lit/",
          "lit-html": "/deps/lit-html/lit-html.js",
          "lit-html/": "/deps/lit-html/",
          "lit-element/": "/deps/lit-element/",
          "@lit/reactive-element": "/deps/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/deps/@lit/reactive-element/",
          "marked": "/deps/marked/lib/marked.esm.js",
          "@jaimestill/spike-html-apps-foundation/": "/deps/@jaimestill/spike-html-apps-foundation/dist/"
        }
      }
    </script>
    <script type="module">
      import "@jaimestill/spike-html-apps-foundation/register-full.js";
      import "../dist/chat-thread.js";
      import { figure, make, specimens } from "./specimen.js";

      const user = (text) => ({ type: "message", role: "user", content: [{ type: "input_text", text }] });
      const assistant = (id, text, status = "completed") => ({
        type: "message",
        id,
        role: "assistant",
        status,
        content: text === "" ? [] : [{ type: "output_text", text, annotations: [] }],
      });

      const question = user("Which stages ran for run-01J9X4R7Q2M8ZK3T5V6W, and how long did each take?");
      const answer = assistant(
        "msg_01J9X4R7Q2",
        [
          "Two stages ran for `run-01J9X4R7Q2M8ZK3T5V6W`:",
          "",
          "1. **classify**, in 1.8 s, with 3 outputs",
          "2. **summarize**, in 5.2 s, with 1 output",
          "",
          "See [the run's page](https://example.com/runs/01J9X4R7Q2M8ZK3T5V6W) for its artifacts.",
        ].join("\n"),
      );
      const exchange = [question, answer];

      const fence = [
        user("Show me how to read the run's status."),
        assistant(
          "msg_01J9X4R7Q3",
          [
            "Fetch the run, then read its `status`:",
            "",
            "```js",
            'const response = await fetch("/api/runs/run-01J9X4R7Q2M8ZK3T5V6W");',
            "const run = await response.json();",
            "if (run.status === ",
          ].join("\n"),
          "in_progress",
        ),
      ];

      const list = [
        user("What should I check before a release?"),
        assistant(
          "msg_01J9X4R7Q4",
          ["Before a release, check:", "", "- the changelog's Unreleased section", "- every pin is current", "- the brow"].join("\n"),
          "in_progress",
        ),
      ];

      const refusal = [
        user("Print the pipeline's signing key."),
        {
          type: "message",
          id: "msg_01J9X4R7Q5",
          role: "assistant",
          status: "completed",
          content: [{ type: "refusal", refusal: "I can't share credentials. The key is held by the pipeline's operator." }],
        },
      ];

      const incomplete = [
        user("Summarize every artifact the run produced."),
        assistant(
          "msg_01J9X4R7Q6",
          "The run produced three artifacts. **release-notes.md** describes the viewer's views; **run.json** records",
          "incomplete",
        ),
      ];

      const failed = [user("/fail"), assistant("msg_01J9X4R7Q7", "Hello from the emulator. This", "failed")];

      const tools = [
        user("What's the weather in Paris?"),
        {
          type: "reasoning",
          id: "rs_01J9X4R7Q8",
          status: "completed",
          summary: [{ type: "summary_text", text: "The user wants the current weather; call get_weather for Paris." }],
          content: [{ type: "reasoning_text", text: "Paris is a city name. The tool takes a city and a unit.\nCelsius suits a French city." }],
        },
        {
          type: "function_call",
          id: "fc_01J9X4R7Q9",
          status: "completed",
          call_id: "call_01J9X4R7QA",
          name: "get_weather",
          arguments: '{"city":"Paris","unit":"celsius"}',
        },
        {
          type: "function_call_output",
          call_id: "call_01J9X4R7QA",
          output: '{"temperature":14,"conditions":"light rain","updated_at":"2026-10-12T16:41:07Z"}',
        },
        assistant("msg_01J9X4R7QB", "It's **14 °C** in Paris, with light rain."),
      ];

      const unknown = [
        question,
        { type: "web_search_call", id: "ws_01J9X4R7QC", status: "completed", action: { query: "run stages" } },
        {
          type: "message",
          id: "msg_01J9X4R7QD",
          role: "assistant",
          status: "completed",
          content: [
            { type: "output_audio", data: "UklGRg==" },
            { type: "output_text", text: "The run's two stages, **classify** and **summarize**, both completed." },
          ],
        },
      ];

      const long = Array.from({ length: 6 }, (_, turn) => [
        user(`Step ${turn + 1}: what happened in stage ${(turn % 2) + 1}?`),
        assistant(
          `msg_long_${turn}`,
          [
            `Stage ${(turn % 2) + 1} ran on \`run-01J9X4R7Q2M8ZK3T5V6W\` and wrote its outputs.`,
            "",
            "| Output | Size |",
            "| :--- | ---: |",
            "| summary.md | 1.5 kB |",
            "| stages.csv | 48 kB |",
          ].join("\n"),
        ),
      ]).flat();

      const thread = (fields) => () => make("sl-chat-thread", fields);
      const states = [
        ["Empty", []],
        ["An exchange: the user's message, then the assistant's", exchange],
        ["Streaming inside an open code fence", fence],
        ["Streaming inside a half-built list", list],
        ["A refusal", refusal],
        ["Incomplete: the reply stopped before finishing", incomplete],
        ["Failed: the reply failed part way", failed],
        ["Reasoning and tool calls", tools],
        ["An unknown item and an unknown part among known ones, skipped", unknown],
        ["Long content: held to 16rem by the page, scrolling inside the thread", long, "held"],
      ].flatMap(([label, items, className = ""]) =>
        [false, true].map((verbose) => ({
          label: `${label}; verbose ${verbose ? "on" : "off"}`,
          build: thread({ items, verbose, className }),
        })),
      );
      // The verbose items again, each details opened once the thread renders, so the capture shows
      // what each holds.
      states.splice(states.findIndex(({ label }) => label.startsWith("Reasoning")) + 2, 0, {
        label: "Reasoning and tool calls, each opened; verbose on",
        build: () => {
          const element = thread({ items: tools, verbose: true })();
          element.updateComplete.then(() => {
            for (const details of element.shadowRoot.querySelectorAll("details")) details.open = true;
          });
          return element;
        },
      });
      specimens(states, {
        label: "Focused by Tab: the scrolling frame",
        build: thread({ items: long, className: "held" }),
      });
      // A short exchange in each parent that sizes it to its content, by the parent's class in
      // demo.css.
      const short = [user("Status?"), assistant("msg_short", "All **3** stages completed.")];
      const fit = (label, parent) => ({
        label,
        build: () => make("div", { className: parent }, [thread({ items: short })()]),
      });
      document.querySelector("#fit .fits").append(
        ...[
          fit("In an inline-block", "fit-inline-block"),
          fit("A content-sized flex item: display flex, the thread flex none", "fit-flex"),
          fit("In a grid's auto track, beside a 1fr track", "fit-grid"),
        ].map(figure),
      );
    </script>
  </head>
  <body>
    <main class="unframed">
      <h1>Chat thread</h1>
      <p><code>sl-chat-thread</code>, a conversation's items in order, in each of its states, with verbose off and on.</p>

      <section id="states">
        <h2>States</h2>
        <div class="states"></div>
      </section>

      <section id="narrow" class="narrow">
        <h2>States at 20rem</h2>
        <div class="states"></div>
      </section>

      <section id="fit">
        <h2>Sized to its content</h2>
        <p>A short exchange's thread in parents that size it to its content.</p>
        <div class="fits"></div>
      </section>

      <section id="focus">
        <h2>Focus visible</h2>
        <p>The thread's scrolling frame, reached by the keyboard.</p>
        <span tabindex="-1" data-focus-start="1"></span>
        <div class="states"></div>
      </section>
    </main>
  </body>
</html>
