<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>artifact viewer specimen</title>
    <!-- The artifact viewer's specimen page, from dist/: a Markdown document, JSON, JSON whose
         keys, numbers, and duplicates a parse would change, invalid JSON,
         plain text, text/html shown as text, content long enough to scroll, the native views of
         test/fixtures/media.js's Blobs, a PDF, an image, audio, and video, XML, YAML, and SVG
         shown as their source, an unknown type whose bytes are text, an unknown type whose bytes
         are binary, as a note and with a Blob's download link, loading, an error, and empty content; then with no-header, so the content or the note shows alone, the
         Markdown document, loading, the error, invalid JSON, the bytes that aren't text, and the
         empty content.
         The viewer is as tall as its content, so each shows at full size but the long content,
         which the page holds to 16rem by demo.css's held class, so it scrolls.
         Every state is labelled, then shown again in a section 20rem wide; the fit section holds
         the JSON viewer in three parents that size it to its content, an inline-block, a
         content-sized flex item, and a grid's auto track; and the focus section holds one
         instance whose scrolling region the screenshot script reaches with a Tab press. The viewer
         draws its own frame, so main is unframed: no specimen frame around it. The page
         links the installed foundation's full entry, page-full.css, and imports
         register-full.js, so a profile applies by attribute on the root; its import map is
         components.html's, so it runs served only: mise run demo, or mise run screenshots. -->
    <link rel="stylesheet" href="/deps/@jaimestill/spike-html-apps-foundation/dist/page-full.css" />
    <link rel="stylesheet" href="demo.css" />
    <script type="importmap">
      {
        "imports": {
          "lit": "/deps/lit/index.js",
          "lit/": "/deps/lit/",
          "lit-html": "/deps/lit-html/lit-html.js",
          "lit-html/": "/deps/lit-html/",
          "lit-element/": "/deps/lit-element/",
          "@lit/reactive-element": "/deps/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/deps/@lit/reactive-element/",
          "marked": "/deps/marked/lib/marked.esm.js",
          "@jaimestill/spike-html-apps-foundation/": "/deps/@jaimestill/spike-html-apps-foundation/dist/"
        }
      }
    </script>
    <script type="module">
      import "@jaimestill/spike-html-apps-foundation/register-full.js";
      import "../dist/artifact-viewer.js";
      import { figure, make, specimens } from "./specimen.js";
      import * as media from "../test/fixtures/media.js";

      const document_ = [
        "# Release notes",
        "",
        "The **artifact viewer** renders a run's outputs by their *content type*, with `markdown()`",
        "for documents like this one. See [the changelog](https://example.com/changelog).",
        "",
        "## What changed",
        "",
        "- Markdown, JSON, and text each have a view",
        "- Long content scrolls inside the viewer",
        "  1. by the keyboard, once it has focus",
        "  2. or by the pointer",
        "",
        "| Type | View | Size |",
        "| :--- | :--- | ---: |",
        "| text/markdown | Markdown | 1.5 kB |",
        "| application/json | JSON | 312 B |",
        "| text/csv | Text | 48 kB |",
        "",
        "```js",
        'const viewer = document.querySelector("sl-artifact-viewer");',
        'Object.assign(viewer, { name: "notes.md", contentType: "text/markdown", content });',
        "```",
        "",
        "> A type that isn't text shows a note, never its bytes.",
      ].join("\n");

      const json = JSON.stringify({
        id: "run-01J9X4R7Q2M8ZK3T5V6W",
        status: "complete",
        stages: [
          { name: "classify", duration_ms: 1840, outputs: 3 },
          { name: "summarize", duration_ms: 5216, outputs: 1 },
        ],
        updated_at: "2026-10-12T16:41:07Z",
      });

      const text = [
        "stage,started_at,duration_ms,status",
        "classify,2026-10-12T16:40:58Z,1840,complete",
        "summarize,2026-10-12T16:41:00Z,5216,complete",
      ].join("\n");

      const long = Array.from(
        { length: 80 },
        (_, i) =>
          `${String(i + 1).padStart(3, " ")}  2026-10-12T16:${String(i % 60).padStart(2, "0")}:07Z  ` +
          `stage ${(i % 4) + 1} of 4  run-01J9X4R7Q2M8ZK3T5V6W  ${i % 7 === 0 ? "retry" : "ok"}`,
      ).join("\n");

      const viewer = (fields) => () => make("sl-artifact-viewer", fields);
      specimens(
        [
          {
            label: "Markdown: text/markdown; charset=utf-8, rendered",
            build: viewer({ name: "release-notes.md", contentType: "text/markdown; charset=utf-8", content: document_ }),
          },
          {
            label: "JSON: application/json, formatted from its tokens",
            build: viewer({ name: "run.json", contentType: "application/json", content: json }),
          },
          {
            label: "JSON by suffix: application/vnd.run+json",
            build: viewer({ name: "stage.json", contentType: "application/vnd.run+json", content: '{"name":"classify","outputs":3}' }),
          },
          {
            label: "JSON as written: integer-like keys in their order, a big integer, 1.0 and 1e3, a duplicate key",
            build: viewer({
              name: "counts.json",
              contentType: "application/json",
              content: '{"b":"first","10":"ten","2":"two","id":9007199254740993,"ratio":1.0,"limit":1e3,"tag":"a","tag":"b"}',
            }),
          },
          {
            label: "Invalid JSON: its raw text, under a note",
            build: viewer({ name: "broken.json", contentType: "application/json", content: '{"id": "run-01J9X", "status": complete,}' }),
          },
          {
            label: "Plain text: text/csv, preformatted",
            build: viewer({ name: "stages.csv", contentType: "text/csv", content: text }),
          },
          {
            label: "HTML as text: text/html, its markup shown, never run as a page",
            build: viewer({
              name: "report.html",
              contentType: "text/html; charset=utf-8",
              content: '<!doctype html>\n<h1>Run report</h1>\n<script>alert("never runs")<\/script>',
            }),
          },
          {
            label: "Long content: 80 lines, held to 16rem by the page, scrolling inside the viewer",
            build: viewer({ name: "run.log", contentType: "text/plain", content: long, className: "held" }),
          },
          {
            label: "PDF: application/pdf from a Blob, in the browser's own viewer in an iframe",
            build: () => make("sl-artifact-viewer", { name: "summary.pdf", contentType: "application/pdf", content: media.pdf() }),
          },
          {
            label: "Image: image/png from a Blob, 160 by 90, at its natural size",
            build: () => make("sl-artifact-viewer", { name: "chart.png", contentType: "image/png", content: media.png() }),
          },
          {
            label: "Audio: audio/wav from a Blob, a quarter second of silence, with its controls",
            build: () => make("sl-artifact-viewer", { name: "silence.wav", contentType: "audio/wav", content: media.wav() }),
          },
          {
            label: "Video: video/webm from a Blob, a second of 64 by 36, the viewer's width at its aspect",
            build: () => make("sl-artifact-viewer", { name: "clip.webm", contentType: "video/webm", content: media.webm() }),
          },
          {
            label: "XML: application/xml, its source as text",
            build: viewer({
              name: "run.xml",
              contentType: "application/xml",
              content: '<?xml version="1.0" encoding="utf-8"?>\n<run id="run-01J9X">\n  <stage name="classify" outputs="3"/>\n  <stage name="summarize" outputs="1"/>\n</run>',
            }),
          },
          {
            label: "YAML: application/yaml, its source as text",
            build: viewer({
              name: "pipeline.yaml",
              contentType: "application/yaml",
              content: "pipeline:\n  stages:\n    - name: classify\n      retries: 2\n    - name: summarize\n      model: small",
            }),
          },
          {
            label: "SVG: image/svg+xml, its source as text, never rendered, from no URL",
            build: viewer({
              name: "badge.svg",
              contentType: "image/svg+xml",
              content: '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="20">\n  <rect width="80" height="20" rx="3" fill="#2b6f8f"/>\n  <text x="40" y="14" text-anchor="middle" fill="#fff">passing</text>\n</svg>',
            }),
          },
          {
            label: "Unknown, its bytes text: application/x-run-trace from a Blob of UTF-8, shown as text",
            build: () =>
              make("sl-artifact-viewer", {
                name: "run.trace",
                contentType: "application/x-run-trace",
                content: new Blob(["16:40:58.112  classify   start\n16:41:00.004  classify   done   3 outputs\n16:41:05.220  summarize  done   1 output"]),
              }),
          },
          {
            label: "Unknown, its bytes binary: application/zip, a note in place of a string that isn't text",
            build: viewer({ name: "bundle.zip", contentType: "application/zip", content: "PK\u0003\u0004" }),
          },
          {
            label: "Unknown, its bytes binary, from a Blob: application/zip, the note and a link that downloads it",
            build: () =>
              make("sl-artifact-viewer", {
                name: "bundle.zip",
                contentType: "application/zip",
                content: new Blob([new Uint8Array([0x50, 0x4b, 0x03, 0x04, 0x14, 0x00])], { type: "application/zip" }),
              }),
          },
          {
            label: "Loading",
            build: viewer({ name: "summary.md", contentType: "text/markdown", state: "loading" }),
          },
          {
            label: "Error: the message says why",
            build: viewer({ name: "summary.md", contentType: "text/markdown", state: "error", message: "The pipeline returned 404 Not Found." }),
          },
          {
            label: "Empty: a note in place of the empty region",
            build: viewer({ name: "notes.txt", contentType: "text/plain", content: "" }),
          },
          {
            label: "No header: no-header, the content alone, its region still named release-notes.md content",
            build: viewer({ name: "release-notes.md", contentType: "text/markdown; charset=utf-8", content: document_, noHeader: true }),
          },
          {
            label: "No header, loading: its frame named summary.md content",
            build: viewer({ name: "summary.md", contentType: "text/markdown", state: "loading", noHeader: true }),
          },
          {
            label: "No header, an error: its frame named summary.md content",
            build: viewer({ name: "summary.md", contentType: "text/markdown", state: "error", message: "The pipeline returned 404 Not Found.", noHeader: true }),
          },
          {
            label: "No header, invalid JSON: its region named broken.json content, described by the note",
            build: viewer({ name: "broken.json", contentType: "application/json", content: '{"id": "run-01J9X", "status": complete,}', noHeader: true }),
          },
          {
            label: "No header, bytes that aren't text: the note names the type, its frame named bundle.zip content",
            build: viewer({ name: "bundle.zip", contentType: "application/zip", content: "PK\u0003\u0004", noHeader: true }),
          },
          {
            label: "No header, an image: its frame named chart.png content",
            build: () => make("sl-artifact-viewer", { name: "chart.png", contentType: "image/png", content: media.png(), noHeader: true }),
          },
          {
            label: "No header, empty: its frame named notes.txt content",
            build: viewer({ name: "notes.txt", contentType: "text/plain", content: "", noHeader: true }),
          },
        ],
        {
          label: "Focused by Tab: the scrolling region",
          build: viewer({ name: "run.log", contentType: "text/plain", content: long, className: "held" }),
        },
      );
      // The JSON viewer in each parent that sizes it to its content, by the parent's class in demo.css.
      const fit = (label, parent) => ({
        label,
        build: () =>
          make("div", { className: parent }, [
            viewer({ name: "stage.json", contentType: "application/json", content: '{"name":"classify","outputs":3}' })(),
          ]),
      });
      document.querySelector("#fit .fits").append(
        ...[
          fit("In an inline-block", "fit-inline-block"),
          fit("A content-sized flex item: display flex, the viewer flex none", "fit-flex"),
          fit("In a grid's auto track, beside a 1fr track", "fit-grid"),
        ].map(figure),
      );
    </script>
  </head>
  <body>
    <main class="unframed">
      <h1>Artifact viewer</h1>
      <p><code>sl-artifact-viewer</code>, one artifact's content by its content type, in each of its states.</p>

      <section id="states">
        <h2>States</h2>
        <div class="states"></div>
      </section>

      <section id="narrow" class="narrow">
        <h2>States at 20rem</h2>
        <div class="states"></div>
      </section>

      <section id="fit">
        <h2>Sized to its content</h2>
        <p>A short JSON artifact's viewer in parents that size it to its content.</p>
        <div class="fits"></div>
      </section>

      <section id="focus">
        <h2>Focus visible</h2>
        <p>The viewer's scrolling region, reached by the keyboard.</p>
        <span tabindex="-1" data-focus-start="1"></span>
        <div class="states"></div>
      </section>
    </main>
  </body>
</html>
