<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>status badge specimen</title>
    <!-- The status badge's specimen page, from dist/: a short label and a long one. Every state is
         labelled, then shown again in a section 20rem wide, and the focus section holds one
         instance the screenshot script reaches with a Tab press. The page links the installed
         foundation's full entry, page-full.css, and imports register-full.js, so a profile
         applies by attribute on the root; its import map is components.html's, so it runs served
         only: mise run demo, or mise run screenshots. -->
    <link rel="stylesheet" href="/deps/@jaimestill/spike-html-apps-foundation/dist/page-full.css" />
    <link rel="stylesheet" href="demo.css" />
    <script type="importmap">
      {
        "imports": {
          "lit": "/deps/lit/index.js",
          "lit/": "/deps/lit/",
          "lit-html": "/deps/lit-html/lit-html.js",
          "lit-html/": "/deps/lit-html/",
          "lit-element/": "/deps/lit-element/",
          "@lit/reactive-element": "/deps/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/deps/@lit/reactive-element/",
          "@jaimestill/spike-html-apps-foundation/": "/deps/@jaimestill/spike-html-apps-foundation/dist/"
        }
      }
    </script>
    <script type="module">
      import "@jaimestill/spike-html-apps-foundation/register-full.js";
      import "../dist/status-badge.js";
      import { make, specimens } from "./specimen.js";

      const badge = (label) => () => make("sl-status-badge", { label });
      specimens(
        [
          { label: "A short label", build: badge("Draft") },
          {
            label: "A long label",
            build: badge("Awaiting review by the compliance team before publication"),
          },
        ],
        { label: "Focused by Tab", build: badge("Published") },
      );
    </script>
  </head>
  <body>
    <main>
      <h1>Status badge</h1>
      <p><code>sl-status-badge</code>, a label as a button, in each of its states.</p>

      <section id="states">
        <h2>States</h2>
        <div class="states"></div>
      </section>

      <section id="narrow" class="narrow">
        <h2>States at 20rem</h2>
        <div class="states"></div>
      </section>

      <section id="focus">
        <h2>Focus visible</h2>
        <p>The badge's button, reached by the keyboard.</p>
        <span tabindex="-1" data-focus-start="1"></span>
        <div class="states"></div>
      </section>
    </main>
  </body>
</html>
