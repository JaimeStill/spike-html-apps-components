<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pagination specimen</title>
    <!-- The pagination's specimen page, from dist/, on documents.js's fixture: the first, a
         middle, and the last page of nine entries by three, cursor mode, disabled, and no total.
         Every state is labelled, then shown again in a section 20rem wide, and the focus section
         holds one instance the screenshot script reaches with Tab presses. The page links the
         installed foundation's full entry, page-full.css, and imports register-full.js, so a
         profile applies by attribute on the root; its import map is components.html's, so it runs
         served only: mise run demo, or mise run screenshots. -->
    <link rel="stylesheet" href="/deps/@jaimestill/spike-html-apps-foundation/dist/page-full.css" />
    <link rel="stylesheet" href="demo.css" />
    <script type="importmap">
      {
        "imports": {
          "lit": "/deps/lit/index.js",
          "lit/": "/deps/lit/",
          "lit-html": "/deps/lit-html/lit-html.js",
          "lit-html/": "/deps/lit-html/",
          "lit-element/": "/deps/lit-element/",
          "@lit/reactive-element": "/deps/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/deps/@lit/reactive-element/",
          "marked": "/deps/marked/lib/marked.esm.js",
          "@jaimestill/spike-html-apps-foundation/": "/deps/@jaimestill/spike-html-apps-foundation/dist/"
        }
      }
    </script>
    <script type="module">
      import "@jaimestill/spike-html-apps-foundation/register-full.js";
      import "../dist/entry.js";
      import "../dist/pagination.js";
      import { continued, files, pageSizes } from "./documents.js";
      import { make, specimens } from "./specimen.js";

      // A pagination of the fields given, over three entries, nine in all by three a page unless
      // the fields say otherwise.
      const pagination =
        (fields, items = files.items) =>
        () =>
          make(
            "sl-pagination",
            { page: 1, size: 3, total: 9, more: false, pageSizes, ...fields },
            items.map((item) => make("sl-entry", { item })),
          );
      specimens(
        [
          { label: "The first page: 1 of 3", build: pagination({ page: 1, more: true }) },
          { label: "A middle page: 2 of 3", build: pagination({ page: 2, more: true }) },
          { label: "The last page: 3 of 3", build: pagination({ page: 3 }) },
          {
            label: "Cursor mode: page and total null, more true",
            build: pagination({ page: null, total: null, more: true }, continued.items),
          },
          { label: "Disabled, on page 2 of 3", build: pagination({ page: 2, more: true, disabled: true }) },
          {
            label: "No total: no summary and no page count, and more false, so Next is disabled",
            build: pagination({ total: null }),
          },
        ],
        // No entries, so the first Tab reaches the page size, not an entry.
        { label: "Focused by Tab", build: pagination({ page: 2, more: true }, []) },
      );
    </script>
  </head>
  <body>
    <main>
      <h1>Pagination</h1>
      <p><code>sl-pagination</code>, a page of entries between its summary and its controls, in each of its states.</p>

      <section id="states">
        <h2>States</h2>
        <div class="states"></div>
      </section>

      <section id="narrow" class="narrow">
        <h2>States at 20rem</h2>
        <div class="states"></div>
      </section>

      <section id="focus">
        <h2>Focus visible</h2>
        <p>The Next button of a middle page, reached by the keyboard: past the page size and Previous, and the page number.</p>
        <span tabindex="-1" data-focus-start="4"></span>
        <div class="states"></div>
      </section>
    </main>
  </body>
</html>
