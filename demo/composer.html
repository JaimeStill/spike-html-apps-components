<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>composer specimen</title>
    <!-- The composer's specimen page, from dist/: empty, with text, grown over several lines, at
         its bound of eight lines and scrolled to the text's end, busy and busy with a draft,
         disabled and disabled with text. Every state is labelled, then shown again in a section
         20rem wide; the fit section holds a short draft's composer in three parents that size it
         to its content, an inline-block, a content-sized flex item, and a grid's auto track; and
         the focus section holds one instance whose field the screenshot script reaches with a Tab
         press. The field and the control each draw their own native frame, so main is unframed:
         no specimen frame around them. The page links the installed foundation's full entry,
         page-full.css, and imports register-full.js, so a profile applies by attribute on the
         root; its import map is components.html's, so it runs served only: mise run demo, or
         mise run screenshots. -->
    <link rel="stylesheet" href="/deps/@jaimestill/spike-html-apps-foundation/dist/page-full.css" />
    <link rel="stylesheet" href="demo.css" />
    <script type="importmap">
      {
        "imports": {
          "lit": "/deps/lit/index.js",
          "lit/": "/deps/lit/",
          "lit-html": "/deps/lit-html/lit-html.js",
          "lit-html/": "/deps/lit-html/",
          "lit-element/": "/deps/lit-element/",
          "@lit/reactive-element": "/deps/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/deps/@lit/reactive-element/",
          "marked": "/deps/marked/lib/marked.esm.js",
          "@jaimestill/spike-html-apps-foundation/": "/deps/@jaimestill/spike-html-apps-foundation/dist/"
        }
      }
    </script>
    <script type="module">
      import "@jaimestill/spike-html-apps-foundation/register-full.js";
      import "../dist/composer.js";
      import { figure, make, specimens } from "./specimen.js";

      const placeholder = "Ask about a run";
      const short = "Which stages ran for run-01J9X4R7Q2M8ZK3T5V6W?";
      const grown = [
        "Summarize the run's artifacts:",
        "- release-notes.md, what changed",
        "- run.json, each stage's timing",
      ].join("\n");
      const bound = Array.from({ length: 14 }, (_, i) => `Line ${i + 1} of the draft`).join("\n");

      const composer = (fields) => () => make("sl-composer", { placeholder, ...fields });
      // The bound state, scrolled to its text's end once it renders, as a user typing there sees it.
      const scrolled = (fields) => () => {
        const element = composer(fields)();
        element.updateComplete.then(() => {
          const field = element.shadowRoot.querySelector("textarea");
          field.scrollTop = field.scrollHeight;
        });
        return element;
      };
      specimens(
        [
          { label: "Empty: send disabled", build: composer({}) },
          { label: "With text: send enabled", build: composer({ value: short }) },
          { label: "Three lines: the field grown to its text", build: composer({ value: grown }) },
          {
            label: "Fourteen lines: held at eight, scrolled to the end",
            build: scrolled({ value: bound }),
          },
          { label: "Busy: stop in send's place", build: composer({ busy: true }) },
          { label: "Busy with a draft: typing allowed, stop shown", build: composer({ busy: true, value: short }) },
          { label: "Disabled", build: composer({ disabled: true }) },
          { label: "Disabled with text", build: composer({ disabled: true, value: short }) },
        ],
        { label: "Focused by Tab: the field", build: composer({ value: short }) },
      );
      // A short draft's composer in each parent that sizes it to its content, by the parent's
      // class in demo.css.
      const fit = (label, parent) => ({
        label,
        build: () => make("div", { className: parent }, [composer({ value: "Status?" })()]),
      });
      document.querySelector("#fit .fits").append(
        ...[
          fit("In an inline-block", "fit-inline-block"),
          fit("A content-sized flex item: display flex, the composer flex none", "fit-flex"),
          fit("In a grid's auto track, beside a 1fr track", "fit-grid"),
        ].map(figure),
      );
    </script>
  </head>
  <body>
    <main class="unframed">
      <h1>Composer</h1>
      <p><code>sl-composer</code>, a multi-line text field and its send control, in each of its states.</p>

      <section id="states">
        <h2>States</h2>
        <div class="states"></div>
      </section>

      <section id="narrow" class="narrow">
        <h2>States at 20rem</h2>
        <div class="states"></div>
      </section>

      <section id="fit">
        <h2>Sized to its content</h2>
        <p>A short draft's composer in parents that size it to its content.</p>
        <div class="fits"></div>
      </section>

      <section id="focus">
        <h2>Focus visible</h2>
        <p>The composer's field, reached by the keyboard.</p>
        <span tabindex="-1" data-focus-start="1"></span>
        <div class="states"></div>
      </section>
    </main>
  </body>
</html>
