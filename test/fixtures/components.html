<!doctype html>
<!-- The components cases' page: the query's module, when it names one, probe.js or restyle.js in
     test/browser/support/, runs and writes its verdict into #verdict. window.verdict settles once
     the run ends, a module that failed to load included. Lit's, marked's, and the foundation's
     bare specifiers map onto /deps/, where the server answers with the installed packages; the
     foundation's map onto its dist/, as its exports do.
     The page links the foundation's lean entry, page.css, and sets no profile. With entry=full in
     the query it links the full entry, page-full.css, imports register-full.js before the module,
     and sets the root's data-palette, data-space, data-type, and data-scheme from the query's
     palette, space, type, and scheme, as profiles.html's case does. window.styled settles once
     the entry's sheet loads, and the module runs after it.
     Adapted from spike-html-packages-components (4c0a5d8): test/fixtures/components.html,
     renamed. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>components cases</title>
    <script>
      {
        const query = new URLSearchParams(location.search);
        const full = query.get("entry") === "full";
        const link = document.head.appendChild(document.createElement("link"));
        link.rel = "stylesheet";
        window.styled = new Promise((resolve, reject) => {
          link.onload = resolve;
          link.onerror = () => reject(new Error(`no sheet ${link.href}`));
        });
        link.href = `/deps/@jaimestill/spike-html-apps-foundation/dist/${full ? "page-full" : "page"}.css`;
        if (full) {
          const attributes = { palette: "data-palette", space: "data-space", type: "data-type", scheme: "data-scheme" };
          for (const [key, attribute] of Object.entries(attributes)) {
            const value = query.get(key);
            if (value !== null) document.documentElement.setAttribute(attribute, value);
          }
        }
      }
    </script>
    <script type="importmap">
      {
        "imports": {
          "lit": "/deps/lit/index.js",
          "lit/": "/deps/lit/",
          "lit-html": "/deps/lit-html/lit-html.js",
          "lit-html/": "/deps/lit-html/",
          "lit-element/": "/deps/lit-element/",
          "@lit/reactive-element": "/deps/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/deps/@lit/reactive-element/",
          "marked": "/deps/marked/lib/marked.esm.js",
          "@jaimestill/spike-html-apps-foundation/": "/deps/@jaimestill/spike-html-apps-foundation/dist/"
        }
      }
    </script>
  </head>
  <body>
    <main></main>
    <pre id="verdict">FAIL: the cases didn't run</pre>
    <pre id="report"></pre>
    <script>
      let settle;
      window.verdict = new Promise((resolve) => (settle = resolve));
    </script>
    <script type="module">
      const query = new URLSearchParams(location.search);
      const module = query.get("module");
      try {
        await window.styled;
        if (query.get("entry") === "full") {
          await import("@jaimestill/spike-html-apps-foundation/register-full.js");
        }
        if (module !== null) {
          if (!["probe", "restyle"].includes(module)) throw new Error(`no module ${module}`);
          const { run } = await import(`../browser/support/${module}.js`);
          await run();
        }
      } catch (error) {
        document.getElementById("verdict").textContent = `FAIL: ${error.message}`;
      } finally {
        settle();
      }
    </script>
  </body>
</html>
