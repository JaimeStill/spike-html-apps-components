# Adapted from spike-html-packages-components (4c0a5d8): mise.toml, its comments
# citing no earlier source.
# Tasks never install a missing tool; mise run install is the one task that reads the network.
[settings]
task.run_auto_install = false

# The foundation's toolchain at its pins.
[tools]
actionlint = "1.7.12"
node = "26.13.0"
pnpm = "12.16.1"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }

# The browser tier's browser, at the foundation's pin. Chrome for Testing publishes no checksums:
# take the sha256 and size from the download by hand at each bump.
[tools."http:chrome-headless-shell"]
version = "156.0.8078.80"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:547dcd374e02961bf998f6046a267644f8502225c36bb78ca307dab32a0b3eb4", size = "126922702" }

[tasks.preflight]
description = "Fail naming mise run install when a tool the tasks need is missing"
hide = true
run = "scripts/preflight.sh"

[tasks.lint]
description = "Run the linters: ESLint, Prettier, shellcheck, and actionlint"
depends = ["lint:eslint", "lint:format", "lint:shell", "lint:workflows"]

[tasks."lint:eslint"]
description = "Lint with ESLint, the layer's imports included"
depends = ["preflight"]
run = "pnpm exec eslint ."

[tasks."lint:format"]
description = "Check the format with Prettier"
depends = ["preflight"]
run = "pnpm exec prettier --check ."

[tasks."lint:shell"]
description = "Shellcheck the scripts"
run = "shellcheck scripts/*.sh"

# actionlint shellchecks each run: block too, with the shellcheck pinned above.
[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint"
run = "actionlint"

[tasks.types]
description = "Type-check the sources, the browser cases' in-page modules, and the tests with tsc"
depends = ["types:sources", "types:browser", "types:test"]

[tasks."types:sources"]
description = "Type-check the sources with tsc, on the installed foundation's declarations"
depends = ["preflight"]
run = "tsc --noEmit -p ."

# The cases read the declarations the build ships.
[tasks."types:browser"]
description = "Type-check the browser cases' in-page modules against dist/ with tsc"
depends = ["build"]
run = "tsc --noEmit -p test/browser"

# The tests import nothing from dist/, so the check needs no build first.
[tasks."types:test"]
description = "Type-check the Node-side tests and their helpers with tsc, never emitting"
depends = ["preflight"]
run = "tsc -p tsconfig.test.json"

[tasks.build]
description = "Build src/ into dist/: tsc's emit, with the .css beside it"
depends = ["preflight"]
run = "scripts/build.sh"

[tasks."test:unit"]
description = "Run the unit tier on the lint and a pack of the build"
depends = ["preflight", "build"]
run = "node --test 'test/unit/*.test.ts'"

[tasks."test:browser"]
description = "Run the browser tier on dist/ in the pinned chrome-headless-shell"
depends = ["preflight browser", "build"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node --test 'test/browser/*.test.ts'"

[tasks.check]
description = "Run every check; reads no network; writes dist/"
depends = ["lint", "types", "build", "test:unit", "test:browser"]

[tasks.install]
description = "Install the pins and node_modules, the foundation at its tag; reads the network"
run = ["mise install", "pnpm install --frozen-lockfile"]

[tasks.demo]
description = "Serve the components demo page and the specimen pages, on dist/, on the loopback address"
depends = ["build"]
run = "node scripts/demo.js"

# Never a dependency of check: a reviewer's look at the specimen pages, not a test. The capture is
# spike-html-apps-tooling's spike-html-apps-screenshots, on scripts/screenshots.config.js.
[tasks.screenshots]
description = "Capture each specimen page light and dark, in tiles, at the defaults, or --palette/--space/--type <name>, or --all; --page <name> (repeatable), --scheme light|dark, --output terminal|directory|browser, --dir <path>, --keep"
depends = ["preflight browser", "build"]
# Its arguments follow the description, with or without a leading --.
# raw: with dependencies, mise prefixes a task's output through a pipe; icat needs the terminal.
raw = true
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) pnpm exec spike-html-apps-screenshots scripts/screenshots.config.js"

[tasks.currency]
description = "Report every mise tool, package.json pin, action pin, the foundation's and the tooling's tags, and the foundation's peer range behind its latest, exiting nonzero if any"
run = "scripts/currency.sh"
quiet = true
